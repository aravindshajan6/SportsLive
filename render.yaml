# Render Blueprint — deploys the Sportscast API (web service) and the web app (static site)
# from the `sportscast` branch. Dashboard → New → Blueprint → pick this repo.
# You will be prompted for the env vars marked `sync: false` (MONGO_URI, RAPIDAPI_KEY).
services:
  - type: web
    name: sportscast
    runtime: node
    branch: sportscast
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            # MongoDB Atlas connection string
      - key: RAPIDAPI_KEY
        sync: false            # key for livescore-sports.p.rapidapi.com
      - key: JWT_SECRET
        generateValue: true
      # Leave empty to allow any origin; tighten to the web app URL once it is known, e.g.
      # https://sportscast-web.onrender.com
      - key: CORS_ORIGINS
        value: ""

  - type: web
    name: sportscast-web
    runtime: static
    branch: sportscast
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # Host of the API service above (Render fills this in; the app adds https://).
      - key: VITE_API_URL
        fromService:
          type: web
          name: sportscast
          property: host
    routes:
      - type: rewrite        # SPA fallback for deep links
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
