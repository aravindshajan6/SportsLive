<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SportsLive — live football scores, fixtures, lineups, match stats and the latest football news, all in one place." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0a1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="SportsLive — Live football scores & news" />
    <meta property="og:description" content="Live scores, fixtures, lineups, stats and football news." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo/logo-color.png" />
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo/logo-color.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>SportsLive — Live football scores & news</title>
    <script>
      // Apply the saved theme before React mounts to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('sl_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
