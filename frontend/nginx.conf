server {
    # 8080 so nginx can run as an unprivileged user; Traefik targets this port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # NOTE: nginx's add_header does NOT merge across levels — a location block
    # with any add_header of its own discards every header inherited from here.
    # Every location below therefore repeats the security set. Do not "tidy" this
    # by hoisting them back up to the server block; they stop being sent.

    # API -> the api container, addressed by CONTAINER name, never the service name.
    # On the shared `coolify` network a generic name like `backend` can resolve to a
    # neighbouring app's container; `sportscast-api` is unique across the daemon.
    location /api/ {
        # Resolve the upstream at request time via Docker's embedded DNS. With a
        # literal proxy_pass, nginx resolves the name ONCE at startup and caches
        # the IP forever, so redeploying the api alone (which gives it a new IP)
        # leaves nginx 502-ing until the web container is also restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sportscast_api "sportscast-api:4000";
        proxy_pass http://$sportscast_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # No add_header here on purpose: helmet sets the API's security headers
        # upstream, and adding them again produces duplicate, conflicting values
        # (helmet's Referrer-Policy is no-referrer, which is correct for an API).
    }

    # hashed build assets can be cached for a long time
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA fallback for client-side routes (/match/123, /news, ...)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
