server {
    # 8080 so nginx can run as an unprivileged user; Traefik targets this port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API sets its own security headers via helmet; these cover the static SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API -> the api container, addressed by CONTAINER name, never the service name.
    # On the shared `coolify` network a generic name like `backend` can resolve to a
    # neighbouring app's container; `sportscast-api` is unique across the daemon.
    location /api/ {
        proxy_pass http://sportscast-api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # hashed build assets can be cached for a long time
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for client-side routes (/match/123, /news, ...)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
